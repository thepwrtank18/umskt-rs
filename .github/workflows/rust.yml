name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Get keys.json
      run: |
        git clone --no-checkout --depth 1 https://github.com/UMSKT/UMSKT
        cd UMSKT
        git sparse-checkout set keys.json
        git checkout
        mv keys.json ../keys.json
    - name: Build
      run: cargo build --verbose
    - name: Run
      run: cargo run
